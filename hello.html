<title>Shelfie Hello</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;500&display=swap">
<style>
  /* Layout: one centered card on a quiet page, like a bookplate pasted inside a cover */
  :root {
    --bg: #eef1ef;
    --card: #ffffff;
    --fg: #1d2a26;
    --muted: #5b6b66;
    --accent: #2f6b5a;
    --rule: #d3dbd8;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111816; --card: #18221f; --fg: #e6ece9; --muted: #9db0aa;
      --accent: #7cc4ad; --rule: #2a3733; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111816; --card: #18221f; --fg: #e6ece9; --muted: #9db0aa;
    --accent: #7cc4ad; --rule: #2a3733; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    display: grid;
    place-items: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .plate {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 40px 36px;
    max-width: 30rem;
    width: 100%;
    box-sizing: border-box;
    display: grid;
    gap: 14px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2.2rem, 7vw, 3rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  p { margin: 0; color: var(--muted); }
  .meta {
    border-top: 1px solid var(--rule);
    padding-top: 14px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>

<main class="plate">
  <span class="eyebrow">Ex libris</span>
  <h1>Hello, reader.</h1>
  <p>This is a first preview page for Shelfie, the book tracking app we're planning. If you can read this, hosting works.</p>
  <div class="meta">Draft spec v0.1 · Want to Read · Currently Reading · Read</div>
</main>
